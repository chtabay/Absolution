<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable</title>
  <meta name="robots" content="noindex">
  <script>
    // Les anciennes adresses, celles des maquettes puis celle de limbes/, mènent à l’accueil : l’application est à la racine du site.
    (function () {
      var p = location.pathname, m = p.match(/^(.*?\/)(?:limbes(?:-[a-z]+)?|maquettes|entites)(?:\/|$)/);
      if (m) location.replace(m[1]);
    })();
  </script>
  <style>
    :root { --bg: #f6f2ea; --ink: #2b2723; --muted: #6f675c; --accent: #3f7d6a; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1d1b19; --ink: #f1ece4; --muted: #b5ac9f; --accent: #8cc7b3; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; box-sizing: border-box; background: var(--bg); color: var(--ink); font: 1.05rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    h1 { margin: 0 0 .4rem; font-size: 1.4rem; }
    p { margin: .3rem 0; color: var(--muted); }
    a { color: var(--accent); font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Cette page n’existe pas.</h1>
    <p><a id="accueil" href="/Absolution/">Aller à l’archipel</a></p>
  </main>
  <script>
    (function () { // les liens suivent l’adresse du site, même s’il change de nom
      var base = /\.github\.io$/.test(location.hostname) ? '/' + location.pathname.split('/')[1] + '/' : '/';
      document.getElementById('accueil').href = base;
    })();
  </script>
</body>
</html>
