<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Limbes · l’entité</title>
  <meta name="description" content="Planche : quatre incarnations de ce qu’on dépose, et le geste de l’envoyer au monde.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f6f2ea">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233f7d6a'/%3E%3Ccircle cx='32' cy='34' r='13' fill='%23f6f2ea'/%3E%3C/svg%3E">
  <link rel="preload" href="../fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="entites.css">
  <script type="module" src="entites.js"></script>
</head>
<body>
  <header class="head">
    <span class="brand">Limbes <small>planche · l’entité</small></span>
    <a class="quiet" href="../maquettes/">maquettes</a>
  </header>

  <main>
    <div class="tabs" role="tablist" aria-label="Incarnations">
      <button type="button" role="tab" aria-selected="true" data-k="forme">La forme</button>
      <button type="button" role="tab" aria-selected="false" data-k="braise">La braise</button>
      <button type="button" role="tab" aria-selected="false" data-k="ciel">Le ciel</button>
      <button type="button" role="tab" aria-selected="false" data-k="cairn">Le cairn</button>
    </div>

    <div class="stage"><canvas id="c" aria-label="L’entité, la tienne et celle du monde"></canvas></div>
    <p id="legend" class="legend"></p>

    <div class="actions">
      <button type="button" id="send" class="btn">Envoyer au monde</button>
      <button type="button" id="again" class="quiet" hidden>encore une</button>
    </div>

    <section class="controls" aria-label="Ce que tu déposes">
      <p class="hint">Ce que tu déposes. L’entité suit.</p>
      <label class="slider"><span>éteint</span><input type="range" id="a" min="0" max="1" step="0.01" value="0.5" aria-label="éteint ou agité"><span>agité</span></label>
      <label class="slider"><span>douloureux</span><input type="range" id="v" min="0" max="1" step="0.01" value="0.35" aria-label="douloureux ou supportable"><span>supportable</span></label>
      <label class="slider"><span>léger</span><input type="range" id="w" min="0" max="1" step="0.01" value="0.5" aria-label="léger ou écrasant"><span>écrasant</span></label>
      <div class="chips">
        <button type="button" class="chip" data-p="m" aria-pressed="false">moral</button>
        <button type="button" class="chip" data-p="r" aria-pressed="false">relationnel</button>
        <button type="button" class="chip" data-p="p" aria-pressed="false">projet</button>
        <button type="button" class="chip" data-p="t" aria-pressed="false">il y a un texte</button>
      </div>
    </section>

    <p id="worldline" class="tiny"></p>
  </main>

  <noscript><p class="noscript">Cette page a besoin de JavaScript.</p></noscript>
</body>
</html>
